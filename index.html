<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>노동안전보건실 참석확인서 집계</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family:-apple-system,'Malgun Gothic',sans-serif; margin:0; background:#eef1f6; color:#1a1a1a; }
  .wrap { max-width:1120px; margin:0 auto; padding:22px 18px; }
  button { border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; }
  button.primary { background:#2f4f8f; color:#fff; font-weight:700; }
  button.ghost { background:#fff; border:1px solid #d5d9e0; }
  button.danger { background:#fdeaea; color:#c62828; }
  button.icon { padding:5px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { padding:9px; border:1px solid #d5d9e0; border-radius:7px; font-size:13px; }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13px; }
  th, td { padding:9px 12px; border-bottom:1px solid #edf0f4; text-align:left; white-space:nowrap; }
  th { background:#2f4f8f; color:#fff; font-weight:600; }
  tr:hover td { background:#f7f9fc; }
  .card { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .link { color:#2f4f8f; cursor:pointer; text-decoration:underline; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; }
  .badge.full { background:#e6f4ea; color:#1a7f37; }
  .badge.part { background:#fff4e0; color:#a15c00; }
  .badge.none { background:#f1f1f1; color:#888; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:#fff; border-radius:12px; padding:22px; width:400px; max-width:100%; max-height:90vh; overflow:auto; }
  .modal label { font-size:12px; font-weight:700; display:block; margin:10px 0 4px; }
  .modal input, .modal select { width:100%; }
  .modal .actions { display:flex; gap:8px; margin-top:16px; }
  .modal .actions button { flex:1; }
  .empty { color:#999; text-align:center; padding:30px; }
  .row-flex { display:flex; gap:6px; align-items:center; }
  .summary-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:14px; }
  .summary-grid .box { background:#f7f9fc; border-radius:10px; padding:14px; }
  .summary-grid .box b { display:block; font-size:12px; color:#888; margin-bottom:4px; font-weight:600; }
  .summary-grid .box span { font-size:20px; font-weight:700; color:#2f4f8f; }
  .notice { background:#fff8e8; border-radius:8px; padding:10px 14px; font-size:12.5px; color:#8a5a00; margin-top:10px; }
</style>
</head>

<div id="bootScreen" style="display:none; min-height:100vh; align-items:center; justify-content:center; background:#eef1f6;">
  <div class="card" style="width:400px;">
    <div style="font-weight:700; font-size:16px; margin-bottom:4px;">🏭 최초 설정</div>
    <div style="font-size:12.5px; color:#888; margin-bottom:16px;">이 저장소에 데이터가 아직 없습니다. 관리자 계정과 GitHub 토큰을 등록하면 시작할 수 있습니다.</div>
    <label>GitHub Personal Access Token</label>
    <input id="boot_token" type="password" placeholder="github_pat_..." style="width:100%;" />
    <div class="notice">Fine-grained 토큰, 이 저장소(hhiun-safety)에 대해 Contents: Read and write 권한으로 발급하세요. 이 브라우저에만 저장되며 GitHub로만 전송됩니다.</div>
    <label>관리자 사번</label><input id="boot_id" style="width:100%;" />
    <label>관리자 이름</label><input id="boot_name" style="width:100%;" />
    <div class="notice">초기 비밀번호는 사번과 동일하게 설정됩니다.</div>
    <button class="primary" id="bootBtn" style="width:100%; margin-top:14px;">초기화하고 시작</button>
    <div id="bootMsg" style="color:#c62828; font-size:12.5px; margin-top:10px;"></div>
  </div>
</div>

<script>
// ============================================================
// GitHub 저장소 설정 — 이 저장소가 곧 데이터베이스입니다.
// ============================================================
const GH_OWNER = 'nsc8410';
const GH_REPO = 'hhiun-safety';
const GH_BRANCH = 'main';
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`;

const PATHS = {
  members: 'data/members.json',
  events: 'data/events.json',
  attendance: 'data/attendance.json',
  users: 'data/users.json',
  settings: 'data/settings.json'
};

function getToken() { return localStorage.getItem('gh_pat') || ''; }
function setToken(t) { localStorage.setItem('gh_pat', t); }

function b64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function b64DecodeUnicode(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

async function readJSON(path, fallback) {
  // 토큰(=쓰기 권한)이 있는 사람은 GitHub API로 직접 읽어 지연 없이 항상 최신 상태를 본다.
  // 토큰 없는 순수 조회자는 raw.githubusercontent.com을 쓰며, 드물게 몇 분 지연될 수 있다.
  if (getToken()) {
    try {
      const res = await fetch(`${GH_API}/contents/${path}?ref=${GH_BRANCH}&_=${Date.now()}`, {
        headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if (res.status === 404) return fallback;
      if (res.ok) {
        const json = await res.json();
        return JSON.parse(b64DecodeUnicode(json.content));
      }
    } catch (err) {
      // 실패하면 아래 raw 방식으로 폴백
    }
  }
  const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${path}?t=${Date.now()}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return fallback;
    return await res.json();
  } catch (err) {
    return fallback;
  }
}

async function ghFetch(endpoint, options = {}) {
  const res = await fetch(`${GH_API}${endpoint}`, {
    ...options,
    headers: {
      Authorization: `Bearer ${getToken()}`,
      Accept: 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`GitHub API 오류 (${res.status}): ${body.slice(0, 200)}`);
  }
  return res.json();
}

// filesObj: { 'data/events.json': arrayOrObject, ... } — 한 번의 커밋으로 여러 파일 동시 반영
// 여러 탭/사용자가 동시에 쓰기 작업을 하면 "fast forward" 충돌이 나므로, 실패 시 매번
// 최신 상태를 다시 읽어 자동으로 여러 번 재시도한다. 사용자는 보통 버튼을 다시 누를 필요가 없다.
// 파일 1개만 바꿀 땐 Contents API로 2번만 호출해서 빠르게 저장(대부분의 경우).
// 파일 여러 개를 한 번에 바꿔야 할 땐(예: 일정 삭제 시 일정+출석기록 동시 반영) 기존의
// 원자적 커밋(Git Data API, 6단계) 방식을 그대로 쓴다.
async function commitFiles(filesObj, message, retries = 6) {
  const paths = Object.keys(filesObj);
  if (paths.length === 1) return commitSingleFile(paths[0], filesObj[paths[0]], message, retries);
  return commitFilesAtomic(filesObj, message, retries);
}

async function commitSingleFile(path, data, message, retries = 6) {
  const content = b64EncodeUnicode(JSON.stringify(data, null, 2));
  let lastErr = null;
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      let sha;
      try {
        const cur = await ghFetch(`/contents/${path}?ref=${GH_BRANCH}&_=${Date.now()}`);
        sha = cur.sha;
      } catch (e) {
        sha = undefined; // 파일이 아직 없으면 새로 생성
      }
      const body = { message, content, branch: GH_BRANCH };
      if (sha) body.sha = sha;
      await ghFetch(`/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
      return { ok: true };
    } catch (err) {
      lastErr = err;
      const isConflict = /409|sha/i.test(String(err.message || err));
      if (attempt === retries - 1) break;
      const base = isConflict ? 250 : 700;
      await new Promise(r => setTimeout(r, base * (attempt + 1) + Math.random() * 250));
    }
  }
  return { ok: false, error: friendlyCommitError_(lastErr) };
}

async function commitFilesAtomic(filesObj, message, retries = 6) {
  let lastErr = null;
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const ref = await ghFetch(`/git/ref/heads/${GH_BRANCH}`);
      const latestSha = ref.object.sha;
      const commit = await ghFetch(`/git/commits/${latestSha}`);
      const baseTreeSha = commit.tree.sha;

      const treeEntries = [];
      for (const [path, data] of Object.entries(filesObj)) {
        const content = JSON.stringify(data, null, 2);
        const blob = await ghFetch(`/git/blobs`, {
          method: 'POST',
          body: JSON.stringify({ content: b64EncodeUnicode(content), encoding: 'base64' })
        });
        treeEntries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
      }
      const tree = await ghFetch(`/git/trees`, {
        method: 'POST',
        body: JSON.stringify({ base_tree: baseTreeSha, tree: treeEntries })
      });
      const newCommit = await ghFetch(`/git/commits`, {
        method: 'POST',
        body: JSON.stringify({ message, tree: tree.sha, parents: [latestSha] })
      });
      await ghFetch(`/git/refs/heads/${GH_BRANCH}`, {
        method: 'PATCH',
        body: JSON.stringify({ sha: newCommit.sha })
      });
      return { ok: true };
    } catch (err) {
      lastErr = err;
      const isConflict = /not a fast forward|422/.test(String(err.message || err));
      if (attempt === retries - 1) break;
      const base = isConflict ? 300 : 800;
      await new Promise(r => setTimeout(r, base * (attempt + 1) + Math.random() * 300));
    }
  }
  return { ok: false, error: friendlyCommitError_(lastErr) };
}

function friendlyCommitError_(lastErr) {
  const msg = String(lastErr && (lastErr.message || lastErr));
  return /not a fast forward|422|409/.test(msg)
    ? '다른 곳에서 동시에 저장 중이라 계속 충돌했습니다. 이 사이트를 열어둔 다른 탭/창을 모두 닫고 하나에서만 다시 시도해주세요.'
    : msg;
}

  }
  return true;
}

// start/end는 정시(0~23) 정수. 점심시간(12시~13시)과 겹치는 만큼 자동으로 제외한다.
function fmtHour(h) { return String(h).padStart(2, '0') + '시'; }

function computeHours(start, end) {
  let total = end - start;
  if (total < 0) total += 24; // 자정을 넘는 경우
  const overlapStart = Math.max(start, 12);
  const overlapEnd = Math.min(start + total, 13);
  const lunchOverlap = Math.max(0, overlapEnd - overlapStart);
  return Math.max(0, total - lunchOverlap);
}

async function renderEvents(content, offset = 0, preset = null) {
  const EVENTS_PAGE_SIZE = 7;
  // preset: 방금 이 브라우저에서 직접 쓴 데이터가 있으면 그걸 바로 쓰고,
  // GitHub의 읽기 캐시(raw.githubusercontent.com)가 갱신될 때까지 기다리지 않는다.
  const [events, attendance, settings] = preset ? [preset.events, preset.attendance, preset.settings] : await Promise.all([
    readJSON(PATHS.events, []), readJSON(PATHS.attendance, []), readJSON(PATHS.settings, { rate: 15000 })
  ]);
  events.sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  const countMap = {};
  attendance.forEach(a => { countMap[a.eventId] = (countMap[a.eventId] || 0) + 1; });
  const totalPages = Math.max(1, Math.ceil(events.length / EVENTS_PAGE_SIZE));
  const curPage = Math.floor(offset / EVENTS_PAGE_SIZE);
  const page = events.slice(offset, offset + EVENTS_PAGE_SIZE);

  const pageNumbers = [];
  for (let p = 0; p < totalPages; p++) pageNumbers.push(p);

  content.innerHTML = `
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      ${isAdmin() ? '<button class="primary" id="addEventBtn">일정 등록</button>' : ''}
    </div>
    <div class="card">
      <div class="row-flex" style="justify-content:space-between; margin-bottom:14px;">
        <div style="font-weight:700; font-size:15px;">일정</div>
        <div style="font-size:12.5px; color:#888;">현재 시간당 지급액: <b>${Number(settings.rate).toLocaleString()}원</b></div>
      </div>
      <div id="eventList">${page.length === 0 ? '<div class="empty">등록된 일정이 없습니다.</div>' :
        page.map(ev => `
          <div style="padding:14px 0; border-top:1px solid #edf0f4;">
            <div class="row-flex" style="justify-content:space-between;">
              <div>
                <div class="link" style="font-weight:700; font-size:14.5px;" data-open="${ev.id}">${ev.name}</div>
                <div style="font-size:12px; color:#888; margin-top:3px;">${ev.date} · ${fmtHour(ev.start)}~${fmtHour(ev.end)} · ${ev.hours}시간 · 등록 ${ev.regName} (${ev.regId})</div>
              </div>
              <div class="row-flex">
                <span class="badge full">참석 ${countMap[ev.id] || 0}명</span>
                ${isAdmin() ? `<button class="icon danger" data-del="${ev.id}">삭제</button>` : ''}
              </div>
            </div>
          </div>`).join('')}
      </div>
      ${totalPages > 1 ? `
      <div class="row-flex" style="justify-content:center; margin-top:16px; flex-wrap:wrap;">
        <button class="ghost icon" id="prevPageBtn" ${curPage === 0 ? 'disabled' : ''}>이전</button>
        ${pageNumbers.map(p => `<button class="icon ${p === curPage ? 'primary' : 'ghost'}" data-page="${p}">${p + 1}</button>`).join('')}
        <button class="ghost icon" id="nextPageBtn" ${curPage === totalPages - 1 ? 'disabled' : ''}>다음</button>
      </div>` : ''}
    </div>`;

  if (isAdmin()) document.getElementById('addEventBtn').onclick = () => openAddEventModal(content, events, attendance, settings);
  content.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openEventDetail(el.dataset.open, content)));
  content.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', async (ev2) => {
    if (!requireToken()) return;
    if (!confirm('이 일정과 출석기록을 삭제할까요?')) return;
    const btn = ev2.currentTarget;
    btn.disabled = true; btn.textContent = '삭제 중...';
    const id = el.dataset.del;
    const newEvents = events.filter(e => e.id !== id);
    const newAttendance = attendance.filter(a => a.eventId !== id);
    // 파일 2개를 한 번에 묶어 저장하면 저장소 전체 기준으로 충돌이 잦아지므로,
    // 파일별로 따로(빠른 단일 파일 경로) 순서대로 저장한다.
    const res1 = await commitFiles({ [PATHS.events]: newEvents }, `일정 삭제: ${id}`);
    if (!res1.ok) { btn.disabled = false; btn.textContent = '삭제'; return alert('삭제 실패: ' + res1.error); }
    const res2 = await commitFiles({ [PATHS.attendance]: newAttendance }, `일정 삭제에 따른 출석기록 정리: ${id}`);
    if (!res2.ok) { alert('일정은 삭제됐지만 출석기록 정리는 실패했습니다: ' + res2.error + ' (다시 삭제를 시도해보세요)'); }
    renderEvents(content, 0, { events: newEvents, attendance: newAttendance, settings });
  }));
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  if (prevBtn) prevBtn.onclick = () => renderEvents(content, (curPage - 1) * EVENTS_PAGE_SIZE, { events, attendance, settings });
  if (nextBtn) nextBtn.onclick = () => renderEvents(content, (curPage + 1) * EVENTS_PAGE_SIZE, { events, attendance, settings });
  content.querySelectorAll('[data-page]').forEach(el => el.addEventListener('click', () =>
    renderEvents(content, Number(el.dataset.page) * EVENTS_PAGE_SIZE, { events, attendance, settings })));
}

function genId(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function hourOptions(selected) {
  let opts = '';
  for (let h = 0; h < 24; h++) opts += `<option value="${h}" ${h === selected ? 'selected' : ''}>${String(h).padStart(2, '0')}시</option>`;
  return opts;
}

function openAddEventModal(content, currentEvents, currentAttendance, currentSettings) {
  if (!requireToken()) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const today = new Date().toISOString().slice(0, 10);
  bg.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">일정 등록</h3>
      <label>행사명</label><input id="e_name" placeholder="예: 2026년 09월 16일 전조합원 7시간 부분파업(오전)" />
      <label>날짜</label><input id="e_date" type="date" value="${today}" />
      <div class="row-flex">
        <div style="flex:1;"><label>시작시각</label><select id="e_start">${hourOptions(8)}</select></div>
        <div style="flex:1;"><label>종료시각</label><select id="e_end">${hourOptions(12)}</select></div>
      </div>
      <div class="notice" id="e_hoursPreview"></div>
      <div class="actions">
        <button class="ghost" id="e_cancel">취소</button>
        <button class="primary" id="e_save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const preview = () => {
    const s = Number(bg.querySelector('#e_start').value), e = Number(bg.querySelector('#e_end').value);
    bg.querySelector('#e_hoursPreview').textContent = `참여시간: ${computeHours(s, e)}시간 (점심시간 12~13시는 자동으로 제외됩니다)`;
  };
  bg.querySelector('#e_start').addEventListener('change', preview);
  bg.querySelector('#e_end').addEventListener('change', preview);
  preview();
  bg.querySelector('#e_cancel').onclick = () => bg.remove();
  bg.querySelector('#e_save').onclick = async () => {
    const name = bg.querySelector('#e_name').value.trim();
    if (!name) return alert('행사명을 입력하세요.');
    const date = bg.querySelector('#e_date').value;
    const start = Number(bg.querySelector('#e_start').value);
    const end = Number(bg.querySelector('#e_end').value);
    const saveBtn = bg.querySelector('#e_save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    const newEvent = {
      id: genId('EV'), name, date, start, end, hours: computeHours(start, end),
      regId: session.empId, regName: session.name, regAt: new Date().toISOString()
    };
    const updatedEvents = [...currentEvents, newEvent];
    const res = await commitFiles({ [PATHS.events]: updatedEvents }, `일정 등록: ${name}`);
    if (!res.ok) { saveBtn.disabled = false; saveBtn.textContent = '저장'; return alert('저장 실패: ' + res.error); }
    bg.remove();
    // events.json만 바뀌었으므로 attendance/settings는 이미 있던 값을 그대로 재사용 (추가 조회 없음)
    renderEvents(content, 0, { events: updatedEvents, attendance: currentAttendance, settings: currentSettings });
  };
}

async function openEventDetail(id, content) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" style="width:560px;"><div class="empty">불러오는 중...</div></div>`;
  document.body.appendChild(bg);
  const events = await readJSON(PATHS.events, []);
  let attendance = await readJSON(PATHS.attendance, []);
  const settings = await readJSON(PATHS.settings, { rate: 15000 });
  const ev = events.find(x => x.id === id);
  let count = attendance.filter(a => a.eventId === id).length;
  bg.querySelector('.modal').innerHTML = `
    <h3 style="margin-top:0;">${ev ? ev.name : ''}</h3>
    <div style="font-size:12.5px; color:#888; margin-bottom:12px;" id="e_meta">${ev ? `${ev.date} · ${fmtHour(ev.start)}~${fmtHour(ev.end)} · ${ev.hours}시간 · 참석 ${count}명` : ''}</div>
    <input type="file" id="attFile" accept=".xls,.xlsx" style="display:none" />
    <button class="ghost" id="attUploadBtn">📤 참석자 명단 업로드 (사번 목록 엑셀)</button>
    <div id="uploadResult" style="font-size:12.5px; margin-top:8px;"></div>
    <hr style="border:none; border-top:1px solid #edf0f4; margin:16px 0;" />
    <label>누락된 인원 개별 추가 (사번, 여러 명은 쉼표/공백으로 구분)</label>
    <div class="row-flex">
      <input id="manualIds" placeholder="예: 2101069, 2202036" style="flex:1;" />
      <button class="primary" id="manualAddBtn">추가</button>
    </div>
    <div id="manualResult" style="font-size:12.5px; margin-top:8px;"></div>
    <div class="actions"><button class="ghost" id="e_close" style="flex:1;">닫기</button></div>`;
  bg.querySelector('#e_close').onclick = () => { bg.remove(); renderEvents(content, 0, { events, attendance, settings }); };

  async function applyNewAttendees(empIds, resDiv, busyBtn, busyLabel, idleLabel) {
    busyBtn.disabled = true;
    busyBtn.textContent = busyLabel;
    resDiv.textContent = '';
    const members = await readJSON(PATHS.members, []);
    const memberMap = new Map(members.map(m => [String(m.empId).trim().toUpperCase(), m]));
    const existingSet = new Set(attendance.filter(a => a.eventId === id).map(a => String(a.empId).trim().toUpperCase()));
    let matched = 0, duplicated = 0;
    const unmatched = [];
    const newRecords = [];
    empIds.forEach(rawId => {
      const key = String(rawId).trim().toUpperCase();
      if (!key) return;
      if (existingSet.has(key)) { duplicated++; return; }
      const m = memberMap.get(key);
      if (!m) { unmatched.push(rawId); return; }
      newRecords.push({ id: genId('AT'), eventId: id, empId: m.empId, name: m.name, at: new Date().toISOString() });
      existingSet.add(key);
      matched++;
    });
    if (newRecords.length === 0) {
      resDiv.textContent = `추가된 인원 없음 (중복 ${duplicated}건, 미매칭 ${unmatched.length}건)`;
      busyBtn.disabled = false; busyBtn.textContent = idleLabel;
      return;
    }
    const updatedAttendance = [...attendance, ...newRecords];
    const res = await commitFiles({ [PATHS.attendance]: updatedAttendance }, `출석자 추가: ${id} (+${matched}명)`);
    busyBtn.disabled = false; busyBtn.textContent = idleLabel;
    if (!res.ok) { resDiv.textContent = '저장 실패: ' + res.error; return; }
    attendance = updatedAttendance;
    count = attendance.filter(a => a.eventId === id).length;
    bg.querySelector('#e_meta').textContent = ev ? `${ev.date} · ${fmtHour(ev.start)}~${fmtHour(ev.end)} · ${ev.hours}시간 · 참석 ${count}명` : '';
    resDiv.innerHTML = `매칭 ${matched}명 등록${duplicated ? `, 중복 ${duplicated}건 제외` : ''}${unmatched.length ? `, 명단에 없는 사번 ${unmatched.length}건: ${unmatched.join(', ')}` : ''}`;
  }

  bg.querySelector('#manualAddBtn').onclick = async () => {
    if (!requireToken()) return;
    const raw = bg.querySelector('#manualIds').value;
    const empIds = raw.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
    if (empIds.length === 0) return alert('사번을 입력하세요.');
    await applyNewAttendees(empIds, bg.querySelector('#manualResult'), bg.querySelector('#manualAddBtn'), '추가 중...', '추가');
    bg.querySelector('#manualIds').value = '';
  };

  bg.querySelector('#attUploadBtn').onclick = () => {
    if (!requireToken()) return;
    bg.querySelector('#attFile').click();
  };
  bg.querySelector('#attFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    const empIds = rows.map(r => String(r[0] || '').trim()).filter(Boolean);
    await applyNewAttendees(empIds, bg.querySelector('#uploadResult'), bg.querySelector('#attUploadBtn'), '⏳ 업로드 처리 중...', '📤 참석자 명단 업로드 (사번 목록 엑셀)');
    e.target.value = '';
  });
}

async function renderParticipation(content) {
  const [events, attendance] = await Promise.all([readJSON(PATHS.events, []), readJSON(PATHS.attendance, [])]);
  if (events.length === 0) { content.innerHTML = '<div class="card empty">데이터가 없습니다.</div>'; return; }
  const countMap = {};
  attendance.forEach(a => { countMap[a.eventId] = (countMap[a.eventId] || 0) + 1; });
  const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));
  const last12 = sorted.slice(-12).map(e => ({ date: e.date, name: e.name, count: countMap[e.id] || 0 }));
  const max = Math.max(...last12.map(i => i.count), 1);
  content.innerHTML = `
    <div class="card">
      <div style="font-weight:700; font-size:15px; margin-bottom:2px;">최근 일정 참여 현황</div>
      <div style="font-size:12.5px; color:#888; margin-bottom:20px;">최근 ${last12.length}개 일정의 참석 인원입니다.</div>
      <div style="display:flex; align-items:flex-end; gap:16px; height:260px; border-bottom:2px solid #edf0f4; padding:0 10px;">
        ${last12.map(i => `

async function renderAggregate(content) {
  const today = new Date().toISOString().slice(0, 10);
  const monthAgo = new Date(Date.now() - 20 * 86400000).toISOString().slice(0, 10);
  const settings = await readJSON(PATHS.settings, { rate: 15000 });
  content.innerHTML = `
    <div class="card">
      <div style="font-weight:700; font-size:15px;">기간 전체 집계</div>
      <div style="font-size:12.5px; color:#888; margin-bottom:14px;">예: 9월 1일~9월 27일 동안 참여한 모든 일정을 개인별로 합산합니다.</div>
      <div class="row-flex" style="flex-wrap:wrap;">
        <div><label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">시작일</label><input type="date" id="agFrom" value="${monthAgo}" /></div>
        <div><label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">종료일</label><input type="date" id="agTo" value="${today}" /></div>
        <div><label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">지급일</label><input type="date" id="agPayDate" /></div>
      </div>
      <div class="notice">시간당 지급액: ${Number(settings.rate).toLocaleString()}원 · 각 일정의 저장된 참여시간을 합산하여 총 지급액을 계산합니다.</div>
      <div class="row-flex" style="margin-top:14px;">
        <button class="primary" id="agRunBtn">전체 집계 조회</button>
        <button class="ghost" id="agExportBtn">전체 집계 엑셀 출력</button>
      </div>
      <div id="agResult" style="margin-top:18px;"></div>
    </div>`;

  let lastData = null;
  async function runAggregate(dateFrom, dateTo) {
    const [events, attendance, members] = await Promise.all([
      readJSON(PATHS.events, []), readJSON(PATHS.attendance, []), readJSON(PATHS.members, [])
    ]);
    const inRange = events.filter(e => e.date >= dateFrom && e.date <= dateTo);
    const eventIds = new Set(inRange.map(e => e.id));
    const eventMap = new Map(inRange.map(e => [e.id, e]));
    const memberMap = new Map(members.map(m => [String(m.empId).trim().toUpperCase(), m]));
    const rate = settings.rate;

    const perPerson = new Map();
    attendance.filter(a => eventIds.has(a.eventId)).forEach(a => {
      const key = String(a.empId).trim().toUpperCase();
      const ev = eventMap.get(a.eventId);
      if (!perPerson.has(key)) {
        const m = memberMap.get(key) || {};
        perPerson.set(key, {
          group: m.group || '', empId: a.empId, name: a.name || m.name, dept: m.dept || '',
          phone: m.phone || '', bank: m.bank || '', account: m.account || '', holder: m.holder || '',
          count: 0, hours: 0, records: []
        });
      }
      const p = perPerson.get(key);
      p.count++; p.hours += Number(ev.hours) || 0;
      p.records.push({ date: ev.date, start: ev.start, end: ev.end, hours: ev.hours });
    });
    const people = Array.from(perPerson.values()).map(p => ({
      ...p,
      pay: Math.round(p.hours * rate),
      records: [...p.records].sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start)
    }));
    const groupMap = new Map();
    people.forEach(p => {
      const g = p.group || '미지정';
      if (!groupMap.has(g)) groupMap.set(g, { group: g, peopleCount: 0, recordCount: 0, hours: 0, pay: 0 });
      const gg = groupMap.get(g);
      gg.peopleCount++; gg.recordCount += p.count; gg.hours += p.hours; gg.pay += p.pay;
    });
    return {
      dateFrom, dateTo, rate, eventCount: inRange.length, peopleCount: people.length,
      recordCount: attendance.filter(a => eventIds.has(a.eventId)).length,
      totalHours: people.reduce((s, p) => s + p.hours, 0), totalPay: people.reduce((s, p) => s + p.pay, 0),
      people, groups: Array.from(groupMap.values())
    };
  }

  document.getElementById('agRunBtn').onclick = async () => {
    const dateFrom = document.getElementById('agFrom').value;
    const dateTo = document.getElementById('agTo').value;
    lastData = await runAggregate(dateFrom, dateTo);
    document.getElementById('agResult').innerHTML = `
      <div style="font-weight:700; font-size:14.5px; margin-bottom:4px;">${dateFrom} ~ ${dateTo} 집계 완료</div>
      <div class="summary-grid">
        <div class="box"><b>일정</b><span>${lastData.eventCount}건</span></div>
        <div class="box"><b>참여 인원</b><span>${lastData.peopleCount}명</span></div>
        <div class="box"><b>참여 건수</b><span>${lastData.recordCount}건</span></div>
        <div class="box"><b>총 참여시간</b><span>${lastData.totalHours}시간</span></div>
        <div class="box"><b>예상 지급액</b><span>${lastData.totalPay.toLocaleString()}원</span></div>
      </div>`;
  };
  document.getElementById('agExportBtn').onclick = async () => {
    const btn = document.getElementById('agExportBtn');
    const dateFrom = document.getElementById('agFrom').value;
    const dateTo = document.getElementById('agTo').value;
    const payDate = document.getElementById('agPayDate').value;
    btn.disabled = true; btn.textContent = '⏳ 파일 만드는 중...';
    // 조회 시점에 캐시해둔 데이터를 재사용하지 않고, 출력 직전에 항상 다시 받아온다.
    // (다른 사람이 방금 계좌정보 등을 수정했을 수 있으므로)
    const data = await runAggregate(dateFrom, dateTo);
    await exportAggregateExcel(data, payDate);
    btn.disabled = false; btn.textContent = '전체 집계 엑셀 출력';
  };
}

function dotDate(s) { return String(s || '').replace(/-/g, '.'); }
// "2026-09-16" + 4시간 -> "9월 16일 4시간" (연도 생략, 시간대 대신 총 시간만)
function simpleRecordStr(r) {
  const [, mo, da] = r.date.split('-');
  return `${Number(mo)}월 ${Number(da)}일 ${r.hours}H`;
}

// "1지단","2지단"... 처럼 앞에 숫자가 있으면 숫자 순으로, 없는 그룹(엔진분과, 해양분과 등)은 그 뒤에 가나다순으로.
function groupSortKey(name) {
  const m = String(name || '').match(/^(\d+)/);
  return m ? [0, Number(m[1]), name] : [1, 0, name];
}
function compareGroup(a, b) {
  const ka = groupSortKey(a), kb = groupSortKey(b);
  if (ka[0] !== kb[0]) return ka[0] - kb[0];
  if (ka[1] !== kb[1]) return ka[1] - kb[1];
  return String(ka[2]).localeCompare(String(kb[2]), 'ko');
}

const HEADER_FILL = 'FF2F4F8F';
const HEADER_FONT_COLOR = 'FFFFFFFF';

function styleHeaderRow(row) {
  row.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: HEADER_FILL } };
    cell.font = { bold: true, color: { argb: HEADER_FONT_COLOR } };
    cell.alignment = { vertical: 'middle', horizontal: 'center' };
  });
}

function styleTitleRow(row) {
  row.font = { bold: true, size: 13 };
}

// 데이터 내용 길이에 맞춰 열 너비를 자동으로 넉넉하게 잡아 글자가 안 잘리게 한다.
function autoFitColumns(ws, headerRowNumber) {
  ws.columns.forEach(col => {
    let maxLen = 8;
    col.eachCell({ includeEmpty: false }, cell => {
      const v = cell.value == null ? '' : String(cell.value);
      // 한글은 폭이 넓으므로 대략 1.7배로 가중치를 둔다.
      let w = 0;
      for (const ch of v) w += /[가-힣]/.test(ch) ? 1.7 : 1;
      if (w > maxLen) maxLen = w;
    });
    col.width = Math.min(Math.ceil(maxLen) + 3, 60);
  });
}

async function exportAggregateExcel(data, payDate) {
  const wb = new ExcelJS.Workbook();
  const payDateLabel = payDate ? dotDate(payDate) : '';
  const sortedPeople = [...data.people].sort((a, b) => compareGroup(a.group, b.group) || String(a.empId).localeCompare(String(b.empId)));
  const sortedGroups = [...data.groups].sort((a, b) => compareGroup(a.group, b.group));

  // ---------- 1) 기간별 개인 집계 ----------
  const ws1 = wb.addWorksheet('기간별 개인 집계');
  ws1.columns = [
    { header: '지단/지회', key: 'group' }, { header: '사번', key: 'empId' }, { header: '성명', key: 'name' },
    { header: '소속', key: 'dept' }, { header: '참여일수', key: 'count' }, { header: '총 참여시간', key: 'hours' },
    { header: '시간당 지급액', key: 'rate' }, { header: '총 지급액', key: 'pay' },
    { header: '참여일자 및 시간', key: 'records' }, { header: '휴대전화번호', key: 'phone' },
    { header: '은행', key: 'bank' }, { header: '계좌번호', key: 'account' }
  ];
  sortedPeople.forEach(p => ws1.addRow({
    group: p.group, empId: p.empId, name: p.name, dept: p.dept, count: p.count, hours: p.hours,
    rate: data.rate, pay: p.pay,
    records: p.records.map(r => simpleRecordStr(r)).join(', '),
    phone: p.phone, bank: p.bank, account: p.account
  }));
  styleHeaderRow(ws1.getRow(1));
  ws1.autoFilter = { from: 'A1', to: { row: 1, column: ws1.columns.length } };
  ws1.getColumn('records').alignment = { wrapText: true, vertical: 'top' };
  autoFitColumns(ws1);
  ws1.views = [{ state: 'frozen', ySplit: 1 }];

  // ---------- 2) 기간별 지단 집계 ----------
  const ws2 = wb.addWorksheet('기간별 지단 집계');
  ws2.addRow(['기간별 지단·지회 집계']);
  ws2.addRow([`${dotDate(data.dateFrom)} ~ ${dotDate(data.dateTo)}`]);
  ws2.addRow([]);
  styleTitleRow(ws2.getRow(1));
  const ws2HeaderRowNum = 4;
  ws2.getRow(ws2HeaderRowNum).values = ['구분', '참여 인원', '참여 건수', '총 참여시간', '시간당 지급액', '총 지급액'];
  sortedGroups.forEach(g => ws2.addRow([g.group, g.peopleCount, g.recordCount, g.hours, data.rate, g.pay]));
  styleHeaderRow(ws2.getRow(ws2HeaderRowNum));
  ws2.autoFilter = { from: { row: ws2HeaderRowNum, column: 1 }, to: { row: ws2HeaderRowNum, column: 6 } };
  autoFitColumns(ws2);
  ws2.views = [{ state: 'frozen', ySplit: ws2HeaderRowNum }];

  // ---------- 3) 문자발송용 ----------
  const ws3 = wb.addWorksheet('문자발송용');
  const ws3HeaderRowNum = 1;
  ws3.getRow(ws3HeaderRowNum).values = ['휴대전화번호', '성함', '파업참여 날짜,시간', '파업참여 시간', '집행비용', '은행', '계좌번호', '지급 일자'];
  sortedPeople.forEach(p => {
    const dateTimeStr = p.records.map(r => simpleRecordStr(r)).join(', ');
    ws3.addRow([p.phone, p.name, dateTimeStr, `총 ${p.hours}시간`, `${p.pay.toLocaleString()}원`, p.bank, p.account, payDateLabel]);
  });
  styleHeaderRow(ws3.getRow(ws3HeaderRowNum));
  ws3.autoFilter = { from: { row: ws3HeaderRowNum, column: 1 }, to: { row: ws3HeaderRowNum, column: 8 } };
  ws3.getColumn(3).alignment = { wrapText: true, vertical: 'top' };
  autoFitColumns(ws3);
  ws3.views = [{ state: 'frozen', ySplit: ws3HeaderRowNum }];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const filename = `${data.dateFrom}_${data.dateTo}_전체집계.xlsx`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function renderMembers(content, offset = 0, q = '', presetAll = null) {
  content.innerHTML = `

      <div class="row-flex" style="justify-content:space-between; margin-bottom:6px;">
        <div style="font-weight:700; font-size:15px;">조합원 명단</div>

          <button class="ghost" id="bankUpdateBtn">계좌정보 일괄 등록</button>
          <button class="primary" id="replaceBtn">명단 교체 등록</button>
        </div>
      </div>
      <div style="font-size:12px; color:#888; margin-bottom:10px;">계좌정보 일괄 등록: 사번·은행·계좌번호·예금주(선택)만 있는 엑셀을 올리면, 나머지 정보는 그대로 두고 사번이 일치하는 조합원의 계좌정보만 채워집니다.</div>
      <div class="row-flex" style="margin-bottom:14px;">
        <input id="mq" placeholder="사번 또는 이름 검색" style="flex:1;" value="${q}" />
        <button class="ghost" id="mSearchBtn">검색</button>
        <input type="file" id="replaceFile" accept=".xls,.xlsx" style="display:none" />
        <input type="file" id="bankFile" accept=".xls,.xlsx" style="display:none" />
      </div>
      <div id="memberTableWrap"><div class="empty">불러오는 중...</div></div>
    </div>`;
  document.getElementById('mSearchBtn').onclick = () => renderMembers(content, 0, document.getElementById('mq').value.trim());
  document.getElementById('mq').addEventListener('keydown', e => { if (e.key === 'Enter') renderMembers(content, 0, e.target.value.trim()); });
  document.getElementById('replaceBtn').onclick = () => { if (requireToken()) document.getElementById('replaceFile').click(); };
  document.getElementById('replaceFile').addEventListener('change', (e) => handleReplaceMembers(content, e));
  document.getElementById('bankUpdateBtn').onclick = () => { if (requireToken()) document.getElementById('bankFile').click(); };
  document.getElementById('bankFile').addEventListener('change', (e) => handleBankUpdate(content, e));

  const all = presetAll || await readJSON(PATHS.members, []);
  let results = all;
  if (q) {
    results = /^[0-9A-Za-z]+$/.test(q)
      ? all.filter(m => String(m.empId).trim().toUpperCase() === q.toUpperCase())
      : all.filter(m => String(m.name).startsWith(q));
  }
  const total = results.length;
  const page = results.slice(offset, offset + 50);

  const wrap = document.getElementById('memberTableWrap');
  wrap.innerHTML = `
    <div style="font-size:12.5px; color:#888; margin-bottom:8px;">총 ${total.toLocaleString()}명 · 숫자 입력은 사번 정확검색, 한글 입력은 이름 검색</div>
    <table>
      <thead><tr><th>지단</th><th>사번</th><th>성명</th><th>소속</th><th>연락처/계좌</th><th></th></tr></thead>
      <tbody>${page.map(m => {
        const has1 = !!m.phone, has2 = !!(m.bank && m.account);
        const status = has1 && has2 ? '<span class="badge full">등록완료</span>' : (has1 || has2) ? '<span class="badge part">일부 등록</span>' : '<span class="badge none">미등록</span>';
        return `<tr>
          <td>${m.group || ''}</td><td>${m.empId}</td><td>${m.name}</td><td>${m.dept || ''}</td><td>${status}</td>
          <td class="row-flex"><button class="icon ghost" data-edit="${m.empId}">정보수정</button><button class="icon danger" data-del="${m.empId}">삭제</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    ${offset + 50 < total ? '<div style="text-align:right; margin-top:10px;"><button class="ghost" id="mMoreBtn">더 보기</button></div>' : ''}`;
  wrap.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
    if (!requireToken()) return;
    openMemberModal(page.find(m => m.empId === el.dataset.edit), all, content, offset, q);
  }));
  wrap.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', async () => {
    if (!requireToken()) return;
    if (!confirm('이 조합원을 삭제할까요?')) return;
    const newList = all.filter(m => String(m.empId).trim().toUpperCase() !== el.dataset.del.toUpperCase());
    const res = await commitFiles({ [PATHS.members]: newList }, `조합원 삭제: ${el.dataset.del}`);
    if (!res.ok) return alert('삭제 실패: ' + res.error);
    renderMembers(content, offset, q, newList);
  }));
  const moreBtn = document.getElementById('mMoreBtn');
  if (moreBtn) moreBtn.onclick = () => renderMembers(content, offset + 50, q, all);
}

function openMemberModal(m, currentAll, content, offset, q) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">조합원 정보 수정</h3>
      <label>지단</label><input id="mm_group" value="${m.group || ''}" />
      <label>사번</label><input id="mm_id" value="${m.empId}" disabled />
      <label>성명</label><input id="mm_name" value="${m.name || ''}" />
      <label>소속</label><input id="mm_dept" value="${m.dept || ''}" />
      <label>전화번호</label><input id="mm_phone" value="${m.phone || ''}" />
      <div class="row-flex">
        <div style="flex:1;"><label>은행</label><input id="mm_bank" value="${m.bank || ''}" /></div>
        <div style="flex:1.4;"><label>계좌번호</label><input id="mm_account" value="${m.account || ''}" /></div>
      </div>
      <label>예금주</label><input id="mm_holder" value="${m.holder || ''}" />
      <div class="actions">
        <button class="ghost" id="mm_cancel">취소</button>
        <button class="primary" id="mm_save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#mm_cancel').onclick = () => bg.remove();
  bg.querySelector('#mm_save').onclick = async () => {
    const saveBtn = bg.querySelector('#mm_save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    const all = [...currentAll];
    const idx = all.findIndex(x => String(x.empId).trim().toUpperCase() === String(m.empId).trim().toUpperCase());
    const updated = {
      group: bg.querySelector('#mm_group').value, empId: m.empId, name: bg.querySelector('#mm_name').value,
      dept: bg.querySelector('#mm_dept').value, phone: bg.querySelector('#mm_phone').value,
      bank: bg.querySelector('#mm_bank').value, account: bg.querySelector('#mm_account').value,
      holder: bg.querySelector('#mm_holder').value
    };
    if (idx >= 0) all[idx] = updated; else all.push(updated);
    const res = await commitFiles({ [PATHS.members]: all }, `조합원 정보 수정: ${m.empId}`);
    if (!res.ok) { saveBtn.disabled = false; saveBtn.textContent = '저장'; return alert('저장 실패: ' + res.error); }
    bg.remove();
    renderMembers(content, offset, q, all);
  };
}

async function handleReplaceMembers(content, e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm('현재 조합원 명단 전체를 이 파일 내용으로 교체합니다. 계속할까요?')) { e.target.value = ''; return; }
  const btn = document.getElementById('replaceBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 처리 중...'; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  const hIdx = raw.findIndex(r => r.includes('사번'));
  const headers = hIdx >= 0 ? raw[hIdx] : ['지단', '사번', '성명', '소속', '전화번호', '은행', '계좌번호'];
  const start = hIdx >= 0 ? hIdx + 1 : 0;
  const col = (n) => headers.indexOf(n);
  const rows = [];
  for (let i = start; i < raw.length; i++) {
    const r = raw[i];
    if (!r || r.every(c => String(c).trim() === '')) continue;
    const empId = String(r[col('사번')] ?? '').trim();
    if (!empId) continue;
    rows.push({
      group: r[col('지단')] ?? '', empId, name: r[col('성명')] ?? '', dept: r[col('소속')] ?? '',
      phone: r[col('전화번호')] ?? '', bank: r[col('은행')] ?? '', account: r[col('계좌번호')] ?? ''
    });
  }
  const res = await commitFiles({ [PATHS.members]: rows }, `조합원 명단 교체 (${rows.length}명)`);
  e.target.value = '';
  if (res.ok) { alert(`${rows.length.toLocaleString()}명으로 교체 완료`); renderMembers(content, 0, '', rows); }
  else { if (btn) { btn.disabled = false; btn.textContent = '명단 교체 등록'; } alert('교체 실패: ' + res.error); }
}

async function handleBankUpdate(content, e) {
  const file = e.target.files[0];
  if (!file) return;
  const btn = document.getElementById('bankUpdateBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 처리 중...'; }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

  const hIdx = raw.findIndex(r => r.includes('사번'));
  let idIdx, bankIdx, accountIdx, holderIdx, start;
  if (hIdx >= 0) {
    const headers = raw[hIdx];
    idIdx = headers.indexOf('사번');
    bankIdx = headers.indexOf('은행');
    accountIdx = headers.indexOf('계좌번호');
    holderIdx = headers.indexOf('예금주');
    start = hIdx + 1;
  } else {
    idIdx = 0; bankIdx = 1; accountIdx = 2; holderIdx = 3; start = 0; // 헤더가 없으면 사번,은행,계좌번호,예금주 순서로 간주
  }

  const updates = [];
  for (let i = start; i < raw.length; i++) {
    const r = raw[i];
    if (!r || r.every(c => String(c).trim() === '')) continue;
    const empId = String(r[idIdx] ?? '').trim();
    if (!empId) continue;
    updates.push({
      empId,
      bank: bankIdx >= 0 ? String(r[bankIdx] ?? '').trim() : '',
      account: accountIdx >= 0 ? String(r[accountIdx] ?? '').trim() : '',
      holder: holderIdx >= 0 ? String(r[holderIdx] ?? '').trim() : ''
    });
  }

  const all = await readJSON(PATHS.members, []);
  const indexMap = new Map(all.map((m, i) => [String(m.empId).trim().toUpperCase(), i]));
  let matched = 0;
  const unmatched = [];
  updates.forEach(u => {
    const idx = indexMap.get(u.empId.toUpperCase());
    if (idx === undefined) { unmatched.push(u.empId); return; }
    if (u.bank) all[idx].bank = u.bank;
    if (u.account) all[idx].account = u.account;
    if (u.holder) all[idx].holder = u.holder;
    matched++;
  });

  const res = await commitFiles({ [PATHS.members]: all }, `계좌정보 일괄 등록 (${matched}명)`);
  e.target.value = '';
  if (btn) { btn.disabled = false; btn.textContent = '계좌정보 일괄 등록'; }
  if (!res.ok) return alert('저장 실패: ' + res.error);
  alert(`계좌정보 ${matched}명 업데이트 완료${unmatched.length ? `\n명단에 없는 사번 ${unmatched.length}건: ${unmatched.join(', ')}` : ''}`);
  renderMembers(content, 0, '', all);
}

// ============================================================
// 사용자 설정 (+ GitHub 연결)
// ============================================================
async function renderUsers(content, preset = null) {
  const [users, settings] = preset ? [preset.users, preset.settings] : await Promise.all([readJSON(PATHS.users, []), readJSON(PATHS.settings, { rate: 15000 })]);
  const hasToken = !!getToken();
  content.innerHTML = `
    <div class="card">
      <div style="font-weight:700; font-size:15px; margin-bottom:2px;">GitHub 연결</div>
      <div style="font-size:12.5px; color:#888; margin-bottom:12px;">일정 등록, 출석자 업로드, 명단 수정 등 쓰기 작업에는 이 브라우저에 저장된 GitHub 토큰이 필요합니다.</div>
      <div class="row-flex">
        <span class="badge ${hasToken ? 'full' : 'none'}">${hasToken ? '토큰 등록됨' : '토큰 없음'}</span>
        <button class="ghost" id="tokenBtn">${hasToken ? '토큰 변경' : '토큰 등록'}</button>
      </div>
    </div>
    <div class="card">
      <div class="row-flex" style="justify-content:space-between; margin-bottom:4px;">
        <div style="font-weight:700; font-size:15px;">승인 사용자</div>
        <button class="primary" id="addUserBtn">사용자 추가</button>
      </div>
      <div style="font-size:12.5px; color:#888; margin-bottom:12px;">여기에 등록된 사번만 최초 로그인할 수 있습니다.</div>
      <div id="userTableWrap">
        <table>
          <thead><tr><th>사번</th><th>이름</th><th>권한</th><th>상태</th><th></th></tr></thead>
          <tbody>${users.map(u => `
            <tr><td>${u.empId}</td><td>${u.name}</td><td>${u.role}</td><td>${u.status}</td>
            <td class="row-flex"><button class="icon ghost" data-edit="${u.empId}">수정</button><button class="icon danger" data-del="${u.empId}">삭제</button></td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;

  document.getElementById('tokenBtn').onclick = () => openTokenModal(() => renderUsers(content, { users, settings }));
  document.getElementById('addUserBtn').onclick = () => { if (requireToken()) openAddUserModal(content, users, settings); };
  content.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => {
    if (!requireToken()) return;
    openEditUserModal(content, users, settings, users.find(u => u.empId === el.dataset.edit));
  }));
  content.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', async () => {
    if (!requireToken()) return;
    if (el.dataset.del === session.empId) return alert('본인 계정은 삭제할 수 없습니다.');
    if (!confirm('이 사용자를 삭제할까요?')) return;
    const newUsers = users.filter(u => u.empId !== el.dataset.del);
    const res = await commitFiles({ [PATHS.users]: newUsers }, `사용자 삭제: ${el.dataset.del}`);
    if (!res.ok) return alert('삭제 실패: ' + res.error);
    renderUsers(content, { users: newUsers, settings });
  }));
}

function openEditUserModal(content, currentUsers, currentSettings, u) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">사용자 수정</h3>
      <label>사번</label><input id="eu_id" value="${u.empId}" disabled />
      <label>이름</label><input id="eu_name" value="${u.name || ''}" />
      <label>권한</label>
      <select id="eu_role">
        <option value="관리자" ${u.role === '관리자' ? 'selected' : ''}>관리자</option>
        <option value="일반" ${u.role === '일반' ? 'selected' : ''}>일반</option>
      </select>
      <label>상태</label>
      <select id="eu_status">
        <option value="사용" ${u.status === '사용' ? 'selected' : ''}>사용</option>
        <option value="중지" ${u.status === '중지' ? 'selected' : ''}>중지</option>
      </select>
      <div class="notice"><label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:400;"><input type="checkbox" id="eu_resetpw" style="width:auto;" />비밀번호를 사번으로 초기화</label></div>
      <div class="actions">
        <button class="ghost" id="eu_cancel">취소</button>
        <button class="primary" id="eu_save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#eu_cancel').onclick = () => bg.remove();
  bg.querySelector('#eu_save').onclick = async () => {
    if (u.empId === session.empId && bg.querySelector('#eu_status').value === '중지') {
      return alert('본인 계정은 중지할 수 없습니다.');
    }
    if (u.empId === session.empId && bg.querySelector('#eu_role').value !== '관리자') {
      return alert('본인 계정의 권한은 낮출 수 없습니다.');
    }
    const saveBtn = bg.querySelector('#eu_save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    const newUsers = currentUsers.map(x => {
      if (x.empId !== u.empId) return x;
      const updated = {
        ...x,
        name: bg.querySelector('#eu_name').value.trim() || x.name,
        role: bg.querySelector('#eu_role').value,
        status: bg.querySelector('#eu_status').value
      };
      if (bg.querySelector('#eu_resetpw').checked) updated.password = x.empId;
      return updated;
    });
    const res = await commitFiles({ [PATHS.users]: newUsers }, `사용자 수정: ${u.empId}`);
    if (!res.ok) { saveBtn.disabled = false; saveBtn.textContent = '저장'; return alert('저장 실패: ' + res.error); }
    bg.remove();
    renderUsers(content, { users: newUsers, settings: currentSettings });
  };
}

function openTokenModal(onDone) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">GitHub 토큰 등록</h3>
      <div class="notice">github.com → Settings → Developer settings → Fine-grained tokens에서 이 저장소(${GH_REPO})에 대해 Contents: Read and write 권한으로 발급하세요. 토큰은 이 브라우저에만 저장됩니다.</div>
      <label>Personal Access Token</label><input id="tk_val" type="password" placeholder="github_pat_..." />
      <div class="actions">
        <button class="ghost" id="tk_cancel">취소</button>
        <button class="primary" id="tk_save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#tk_cancel').onclick = () => bg.remove();
  bg.querySelector('#tk_save').onclick = () => {
    const v = bg.querySelector('#tk_val').value.trim();
    if (!v) return alert('토큰을 입력하세요.');
    setToken(v);
    bg.remove(); onDone();
  };
}

function openAddUserModal(content, currentUsers, currentSettings) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">사용자 추가</h3>
      <label>사번</label><input id="u_id" />
      <label>이름</label><input id="u_name" />
      <label>권한</label><select id="u_role"><option>관리자</option><option>일반</option></select>
      <div class="notice">최초 비밀번호는 사번과 동일하게 설정됩니다.</div>
      <div class="actions">
        <button class="ghost" id="u_cancel">취소</button>
        <button class="primary" id="u_save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#u_cancel').onclick = () => bg.remove();
  bg.querySelector('#u_save').onclick = async () => {
    const empId = bg.querySelector('#u_id').value.trim();
    const name = bg.querySelector('#u_name').value.trim();
    if (!empId || !name) return alert('사번과 이름을 입력하세요.');
    if (currentUsers.some(u => u.empId === empId)) return alert('이미 등록된 사번입니다.');
    const saveBtn = bg.querySelector('#u_save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    const newUsers = [...currentUsers, { empId, name, password: empId, role: bg.querySelector('#u_role').value, status: '사용' }];
    const res = await commitFiles({ [PATHS.users]: newUsers }, `사용자 추가: ${empId}`);
    if (!res.ok) { saveBtn.disabled = false; saveBtn.textContent = '저장'; return alert('저장 실패: ' + res.error); }
    bg.remove();
    renderUsers(content, { users: newUsers, settings: currentSettings });
  };
}
